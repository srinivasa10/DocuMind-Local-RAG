name: enterprise-knowledge-assistant-api
services:
  - name: api
    type: web
    instance_type: free
    build_command: pip install -r backend/requirements.txt
    run_command: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    routes:
      - path: /
    env:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: CORS_ORIGINS
        value: https://YOUR-PAGES-PROJECT.pages.dev
      - key: GEMINI_API_KEY
        scope: secret
